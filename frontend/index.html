<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/src/style/style.css">
    <link rel="shortcut icon" href="/assets/favicon.png" type="image/x-icon">
</head>

<body>
    <div class="container-fluid">
        <main class="col-12 conteudo p-4 p-lg-5">
            <div
                class="
                    d-flex
                    flex-column
                    flex-md-row
                    justify-content-between
                    align-items-md-center
                    gap-3
                    mb-4
                "
            >
                <div>
                    <p class="subtitulo">TODO LIST</p>
                    <h1 class="mb-2">Minhas tarefas</h1>
                    <p class="texto-secundario mb-0">
                        Organize e acompanhe suas tarefas.
                    </p>
                </div>

                <div class="d-flex gap-2">
                    <button
                        type="button"
                        class="btn btn-outline-light"
                        data-bs-toggle="modal"
                        data-bs-target="#modalFiltro"
                    >
                        Filtrar
                    </button>

                    <button
                        type="button"
                        class="btn btn-pink"
                        data-bs-toggle="modal"
                        data-bs-target="#modalTarefa"
                        id="botao-adicionar"
                    >
                        + Adicionar tarefa
                    </button>
                </div>
            </div>
            <div class="row g-3 mb-5">
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card card-dashboard h-100">
                        <div
                            class="
                                card-body
                                d-flex
                                justify-content-between
                                align-items-center
                            "
                        >
                            <div>
                                <p class="texto-secundario mb-2">Total de tarefas</p>
                                <h2 id="total-tarefas" class="mb-0">0</h2>
                            </div>
                            <div class="icone-resumo">#</div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card card-dashboard h-100">
                        <div
                            class="
                                card-body
                                d-flex
                                justify-content-between
                                align-items-center
                            "
                        >
                            <div>
                                <p class="texto-secundario mb-2">TODO</p>
                                <h2 id="total-todo" class="mb-0">0</h2>
                            </div>
                            <div class="icone-resumo">○</div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card card-dashboard h-100">
                        <div
                            class="
                                card-body
                                d-flex
                                justify-content-between
                                align-items-center
                            "
                        >
                            <div>
                                <p class="texto-secundario mb-2">Em andamento</p>
                                <h2 id="total-doing" class="mb-0">0</h2>
                            </div>
                            <div class="icone-resumo">◐</div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card card-dashboard h-100">
                        <div
                            class="
                                card-body
                                d-flex
                                justify-content-between
                                align-items-center
                            "
                        >
                            <div>
                                <p class="texto-secundario mb-2">Concluídas</p>
                                <h2 id="total-done" class="mb-0">0</h2>
                            </div>
                            <div class="icone-resumo">✓</div>
                        </div>
                    </div>
                </div>
            </div>
            <section>
                <div class="mb-3">
                    <h2 class="h4 mb-1">Tarefas</h2>
                    <p class="texto-secundario mb-0">Todas as suas tarefas</p>
                </div>
                <div id="tarefas" class="row g-3"></div>
            </section>
        </main>
    </div>
    <div
        class="modal fade"
        id="modalTarefa"
        tabindex="-1"
        aria-labelledby="modalTarefaLabel"
        aria-hidden="true"
    >
        <div
            class="
                modal-dialog
                modal-dialog-centered
            "
        >
            <div class="modal-content modal-pink">
                <div class="modal-header">
                    <div>
                        <p class="subtitulo mb-1">TAREFA</p>
                        <h2 class="modal-title fs-5" id="modalTarefaLabel">Nova tarefa</h2>
                    </div>
                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"
                    ></button>
                </div>
                <form id="form-tarefa">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título</label>
                            <input
                                type="text"
                                class="form-control campo-dark"
                                id="titulo"
                                placeholder="Digite o título da tarefa"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea
                                class="form-control campo-dark"
                                id="descricao"
                                rows="4"
                                placeholder="Descreva a tarefa..."
                                required
                            ></textarea>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="prazo" class="form-label">Prazo</label>
                                <input
                                    type="date"
                                    class="form-control campo-dark"
                                    id="prazo"
                                    required
                                >
                            </div>
                            <div class="col-md-6">
                                <label for="prioridade" class="form-label">Prioridade</label>
                                <select class="form-select campo-dark" id="prioridade" required>
                                    <option value="1">1 - Muito baixa</option>
                                    <option value="2">2 - Baixa</option>
                                    <option value="3">3 - Média</option>
                                    <option value="4">4 - Alta</option>
                                    <option value="5">5 - Muito alta</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select campo-dark" id="status" required>
                                <option value="TODO">TODO</option>
                                <option value="DOING">DOING</option>
                                <option value="DONE">DONE</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoria</label>
                            <select class="form-select campo-dark" id="categoria" required>
                                <option value="Estudos">Estudos</option>
                                <option value="Trabalho">Trabalho</option>
                                <option value="Pessoal">Pessoal</option>
                                <option value="Compras">Compras</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="botao-cancelar"
                            data-bs-dismiss="modal"
                        >
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-pink">Salvar tarefa</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div
        class="modal fade"
        id="modalConfirmarExclusao"
        tabindex="-1"
        aria-labelledby="modalConfirmarExclusaoLabel"
        aria-hidden="true"
    >
        <div
            class="
                modal-dialog
                modal-dialog-centered
                modal-sm
            "
        >
            <div class="modal-content modal-pink">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="modalConfirmarExclusaoLabel">Excluir tarefa</h2>
                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"
                    ></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Tem certeza que deseja excluir esta tarefa?</p>
                </div>
                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>
                    <button
                        type="button"
                        class="btn btn-danger"
                        id="botao-confirmar-exclusao"
                    >
                        Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div
        class="modal fade"
        id="modalFiltro"
        tabindex="-1"
        aria-labelledby="modalFiltroLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-pink">
                <div class="modal-header">
                    <div>
                        <p class="subtitulo mb-1">TAREFAS</p>
                        <h2 class="modal-title fs-5" id="modalFiltroLabel">Filtrar tarefas</h2>
                    </div>
                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"
                    ></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="filtro-status" class="form-label">Status</label>
                        <select class="form-select campo-dark" id="filtro-status">
                            <option value="">Todos</option>
                            <option value="TODO">TODO</option>
                            <option value="DOING">DOING</option>
                            <option value="DONE">DONE</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="filtro-prioridade" class="form-label">Prioridade</label>
                        <select class="form-select campo-dark" id="filtro-prioridade">
                            <option value="">Todas</option>
                            <option value="1">1 - Muito baixa</option>
                            <option value="2">2 - Baixa</option>
                            <option value="3">3 - Média</option>
                            <option value="4">4 - Alta</option>
                            <option value="5">5 - Muito alta</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="filtro-categoria" class="form-label">Categoria</label>
                        <select class="form-select campo-dark" id="filtro-categoria">
                            <option value="">Todas</option>
                            <option value="Estudos">Estudos</option>
                            <option value="Trabalho">Trabalho</option>
                            <option value="Pessoal">Pessoal</option>
                            <option value="Compras">Compras</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="botao-limpar-filtro"
                        data-bs-dismiss="modal"
                    >
                        Limpar filtros
                    </button>
                    <button
                        type="button"
                        class="btn btn-pink"
                        id="botao-aplicar-filtro"
                    >
                        Aplicar filtros
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="/src/script/script.js"></script>
</body>
</html>
